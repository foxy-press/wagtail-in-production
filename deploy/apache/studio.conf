# Apache in front of Gunicorn (chapter 15). Set these three once, e.g. in /etc/apache2/conf-available/studio.conf:
#   Define STUDIO_DOMAIN studio.example
#   Define STUDIO_ROOT   /var/studio
#   Define CERT_DIR      /etc/letsencrypt/live/studio.example

# Plain HTTP: only certificate renewal, everything else to HTTPS.
<VirtualHost *:80>
    ServerName ${STUDIO_DOMAIN}
    Alias /.well-known/acme-challenge/ ${STUDIO_ROOT}/acme/.well-known/acme-challenge/
    <Directory ${STUDIO_ROOT}/acme/.well-known/acme-challenge>
        Require all granted
    </Directory>
    RewriteEngine On
    RewriteCond %{REQUEST_URI} !^/\.well-known/acme-challenge/
    RewriteRule ^ https://${STUDIO_DOMAIN}%{REQUEST_URI} [L,R=301,NE]
</VirtualHost>

<VirtualHost *:443>
    ServerName ${STUDIO_DOMAIN}
    <IfModule mod_http2.c>
        Protocols h2 http/1.1
    </IfModule>

    SSLEngine on
    SSLCertificateFile    ${CERT_DIR}/fullchain.pem
    SSLCertificateKeyFile ${CERT_DIR}/privkey.pem

    # Static files and uploads are served by Apache, never by Django.
    Alias /static/ ${STUDIO_ROOT}/static/
    Alias /media/  ${STUDIO_ROOT}/media/
    <Directory ${STUDIO_ROOT}/static>
        Options -Indexes
        Require all granted
        # collectstatic adds a content hash to file names, so they can be cached for a year.
        Header set Cache-Control "public, max-age=31536000, immutable"
    </Directory>
    <Directory ${STUDIO_ROOT}/media>
        Options -Indexes
        Require all granted
        # Uploaded files are never run or rendered as HTML (chapter 14).
        <FilesMatch "\.(?i:html?|svg|xml|js|php|py|cgi|pl|sh)$">
            ForceType application/octet-stream
            Header set Content-Disposition attachment
        </FilesMatch>
    </Directory>

    ProxyPreserveHost On
    ProxyTimeout 60
    ProxyPass /static/ !
    ProxyPass /media/ !
    ProxyPass / http://127.0.0.1:8005/
    ProxyPassReverse / http://127.0.0.1:8005/
    # Django trusts this header (SECURE_PROXY_SSL_HEADER), so Apache must always set it itself.
    RequestHeader set X-Forwarded-Proto "https"

    # Uploads larger than this are refused before they reach Django.
    LimitRequestBody 20971520

    Header always set Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()"
    Header always unset X-Powered-By
    <IfModule mod_deflate.c>
        AddOutputFilterByType DEFLATE text/html text/css text/plain application/javascript application/json image/svg+xml
    </IfModule>
</VirtualHost>
